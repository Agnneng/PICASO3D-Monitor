[platformio]
default_envs = esp32-2424s012

[env:esp32-2424s012]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 3145728
monitor_speed = 115200
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.9/esp32-core-3.3.9.tar.xz

build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D PIN_LCD_SCLK=6
  -D PIN_LCD_MOSI=7
  -D PIN_LCD_DC=2
  -D PIN_LCD_CS=10
  -D PIN_LCD_BL=3

lib_deps =
  adafruit/Adafruit GFX Library @ ^1.11.11
  https://github.com/adafruit/Adafruit_GC9A01A.git
  olikraus/U8g2_for_Adafruit_GFX @ ^1.8.0
  bblanchon/ArduinoJson @ ^6.21.5
